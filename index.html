<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Document</title>


<style>
    body {
        margin: 0;
        padding: 40px 20px;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #dbeafe, #93c5fd, #eff6ff);
        color: #1e3a8a;
        min-height: 100vh;
        box-sizing: border-box;
    }

    .main-container {
        max-width: 650px;
        margin: 20px auto;
    }

    .page-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .badge {
        display: inline-block;
        background-color: #1d4ed8;
        color: white;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 2px;
    }

    h1 {
        font-size: 36px;
        margin: 18px 0 10px;
        color: #1e40af;
    }

    .page-header p {
        color: #475569;
        font-size: 16px;
    }

    .form-container {
        background-color: white;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(30, 64, 175, 0.15);
        border: 1px solid #bfdbfe;
    }

    .section-heading {
        text-align: center;
        margin-bottom: 30px;
    }

    h2 {
        color: #1e40af;
        margin-bottom: 8px;
    }

    .section-heading p {
        color: #64748b;
        font-size: 14px;
    }

    label {
        display: block;
        margin: 20px 0 8px;
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 1px;
        color: #1d4ed8;
    }

    input[type="text"] {
        width: 100%;
        padding: 14px;
        box-sizing: border-box;
        border: 2px solid #dbeafe;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
        transition: 0.3s;
    }

    input[type="text"]:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 8px rgba(59, 130, 246, 0.2);
    }

    input[type="button"] {
        width: 100%;
        margin-top: 25px;
        padding: 15px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    input[type="button"]:hover {
        background: linear-gradient(135deg, #1e40af, #1e3a8a);
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(37, 99, 235, 0.25);
    }

    .result-container {
        margin-top: 30px;
        padding: 20px;
        background-color: #f1f5f9;
        border: 1px solid #dbeafe;
        border-radius: 14px;
    }

    h3 {
        margin-top: 0;
        color: #1e40af;
        font-size: 16px;
    }

    #div1 {
        min-height: 20px;
        padding: 15px;
        background-color: white;
        border-left: 4px solid #3b82f6;
        border-radius: 8px;
        color: #334155;
        font-size: 15px;
        line-height: 1.6;
        overflow-wrap: anywhere;
        box-shadow: 0 3px 10px rgba(30, 64, 175, 0.06);
    }

    footer {
        text-align: center;
        margin-top: 30px;
        color: #1e40af;
    }

    footer p {
        font-size: 13px;
        font-weight: bold;
        letter-spacing: 3px;
        margin-bottom: 6px;
    }

    footer span {
        font-size: 12px;
        color: #64748b;
    }

    @media (max-width: 500px) {
        body {
            padding: 20px 12px;
        }

        .form-container {
            padding: 22px;
        }

        h1 {
            font-size: 28px;
        }
    }
</style>


</head>
<body>


<div class="main-container">

    <div class="page-header">
        <span class="badge">MATH CLUB PORTAL</span>
        <h1>Math Club Checker</h1>
        <p>Welcome! Check if you're a member of our Math Club.</p>
    </div>

    <div class="form-container">

        <div class="section-heading">
            <h2>Member Search</h2>
            <p>Enter your name in the fields below.</p>
        </div>

        <form>
            <label for="fname">FIRST NAME</label>
            <input type="text" id="fname" placeholder="Enter your first name"><br>

            <label for="lname">LAST NAME</label>
            <input type="text" id="lname" placeholder="Enter your last name"><br>

            <input type="button" py-click="get_name" value="Search Members →">
        </form>

        <div class="result-container">
            <h3>Search Result</h3>
            <div id="div1"></div>
        </div>

    </div>

    <footer>
        <p>LEARN. SOLVE. GROW.</p>
        <span>Mathematics Club Membership System</span>
    </footer>

</div>

<py-script src="main.py"></py-script>


</body>
</html>
